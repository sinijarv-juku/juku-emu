# Tests and builds both apps on every push to main and every pull request,
# except one that changes only documentation (docs/Development.md,
# "Continuous integration"). The Mac app is built as
# for other Macs, for Apple silicon and for Intel, unsigned: releases are
# signed on the developer's Mac (spec §3.4). The tests run for Intel too,
# under Rosetta 2, when the runner has it.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust, as rust-toolchain.toml names it
        run: rustup toolchain install
      - name: Xcode's Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Tests
        run: cargo test --locked
      - name: Build
        run: ./build.sh dist
      - name: Build for Intel
        run: ./build.sh dist x86_64
      - name: Tests for Intel
        run: |
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            rustup target add x86_64-apple-darwin
            cargo test --locked --target x86_64-apple-darwin
          else
            echo "::notice::This runner has no Rosetta 2: the Intel tests did not run"
          fi

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust, as rust-toolchain.toml names it
        run: rustup toolchain install
      - name: Inno Setup, for the installer
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
              choco install innosetup --yes --no-progress
          }
      - name: Tests
        run: cargo test --locked
      - name: Build
        shell: cmd
        run: build.cmd dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            target/Juku-*-windows-x64.zip
            target/Juku-*-windows-x64-setup.exe
          if-no-files-found: error
