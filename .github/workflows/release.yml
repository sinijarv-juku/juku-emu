# A tag vX.Y.Z makes a draft release with the Windows zip and installer
# (docs/Development.md, "Releasing"). The macOS disk images, Apple silicon's
# and Intel's, are signed and notarized on the developer's Mac and added to
# the draft by hand, which is then published. Run by hand for a tag pushed
# before this workflow existed.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The release's tag, vX.Y.Z
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - name: The tag is VERSION's
        shell: bash
        run: test "$TAG" = "v$(cat VERSION)" || { echo "::error::$TAG is not v$(cat VERSION)"; exit 1; }
      - name: Rust, as rust-toolchain.toml names it
        run: rustup toolchain install
      - name: Inno Setup, for the installer
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
              choco install innosetup --yes --no-progress
          }
      - name: Build
        shell: cmd
        run: build.cmd dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            target/Juku-*-windows-x64.zip
            target/Juku-*-windows-x64-setup.exe
          if-no-files-found: error

  release:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows
          path: dist
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        # The changes are written by hand before the draft is published:
        # the placeholder is left in sight so that it is not forgotten.
        run: |
          previous=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || git rev-list --max-parents=0 --abbrev-commit "$TAG")
          cat > notes.md <<EOF
          Juku ${TAG#v}, an emulator of the Juku E5101/E5104 school computer. See the [README](https://github.com/sinijarv-juku/juku-emu#readme) for what it does and how to use it.

          **Downloads**

          - **macOS 14 or later:** \`Juku-${TAG#v}-macos-arm64.dmg\` for Apple silicon, \`Juku-${TAG#v}-macos-x64.dmg\` for Intel, signed and notarized. Open it and drag Juku to Applications. The Intel version has not been tried on an Intel Mac yet; if it does not work there, please [report it](https://github.com/sinijarv-juku/juku-emu/issues).
          - **Windows 10 and 11, x64:** \`Juku-${TAG#v}-windows-x64-setup.exe\`, or the \`.zip\` to unpack and run anywhere. They are not signed yet, so Windows may warn that it does not know the publisher: choose More info, then Run anyway.

          ## Changes

          TODO before publishing: the changes since $previous (\`git log $previous..$TAG\`), and what in a disk image, snapshot, setting or debug configuration must change, if anything.
          EOF
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft \
              --title "Juku ${TAG#v}" --notes-file notes.md
